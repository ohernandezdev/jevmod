# One command, one service per role, one SQLite volume shared by all of them.
#   cp .env.example .env   (fill what you use)   ->   docker compose up -d
services:
  api:
    build: .
    environment: { JEVMOD_ROLE: api }
    env_file: .env
    ports: ["8080:8080"]
    volumes: ["jevmod-data:/data"]
    restart: unless-stopped
  discord:
    build: .
    environment: { JEVMOD_ROLE: discord }
    env_file: .env
    volumes: ["jevmod-data:/data"]
    restart: unless-stopped
    profiles: ["discord"]
  telegram:
    build: .
    environment: { JEVMOD_ROLE: telegram }
    env_file: .env
    volumes: ["jevmod-data:/data"]
    restart: unless-stopped
    profiles: ["telegram"]
  reddit:
    build: .
    environment: { JEVMOD_ROLE: reddit }
    env_file: .env
    volumes: ["jevmod-data:/data"]
    restart: unless-stopped
    profiles: ["reddit"]
  twitch:
    build: .
    environment: { JEVMOD_ROLE: twitch }
    env_file: .env
    volumes: ["jevmod-data:/data"]
    restart: unless-stopped
    profiles: ["twitch"]
  youtube:
    build: .
    environment: { JEVMOD_ROLE: youtube }
    env_file: .env
    volumes: ["jevmod-data:/data"]
    restart: unless-stopped
    profiles: ["youtube"]
  # There was a `demo` service here. The role left the open package with the rest of the commercial code, so
  # the container started and exited on "unknown role"; the hosted repository runs the demo now.
volumes:
  jevmod-data: {}
